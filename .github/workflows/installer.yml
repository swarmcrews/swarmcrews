name: Installer

on:
  pull_request:
    paths:
      - 'install/**'
      - 'scripts/install/**'
      - '.github/workflows/installer.yml'
      - 'package.json'
  # Release promotion requires a successful Installer run at the exact commit.
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-free:
    name: ${{ matrix.os }} dependency-free installer
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.0
      # Deliberately no pnpm/npm install: the wizard must work without app deps.
      - name: Run installer behavior and native bootstrap preview tests
        run: node --test scripts/install/*.test.mjs
      - name: Validate POSIX entrypoints
        if: runner.os != 'Windows'
        run: bash -n install/linux.sh install/macos.sh
      - name: Validate Windows PowerShell syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'install/windows.ps1'), [ref]$tokens, [ref]$errors
          ) | Out-Null
          if ($errors.Count) { $errors | Format-List; exit 1 }
