name: Portable release

on:
  workflow_dispatch:
  push:
    tags: ['v*-alpha.*']

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: node scripts/release/gates.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm test:install
      - run: pnpm test:sqlite
      - run: pnpm audit:prod
      - run: npm audit --prefix scripts/release/runtime --omit=dev --omit=optional --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:smoke

  native:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
          - os: macos-15-intel
            target: darwin-x64
          - os: macos-15
            target: darwin-arm64
          - os: windows-2022
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - name: Require native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: node --input-type=module -e "import assert from 'node:assert/strict'; assert.equal(process.platform + '-' + process.arch, process.env.EXPECTED_TARGET)"
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release/gates.mjs
      - run: pnpm test:release
      - run: node scripts/release/build.mjs .scratch/release-assets
      - name: Smoke test extracted artifact outside checkout
        shell: bash
        run: |
          for archive in .scratch/release-assets/*.tar.gz .scratch/release-assets/*.zip; do
            [ -f "$archive" ] || continue
            node scripts/release/smoke.mjs "$archive"
          done
      - name: Attest tested archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            .scratch/release-assets/*.tar.gz
            .scratch/release-assets/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-${{ matrix.target }}
          path: .scratch/release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    # Dispatch builds/test/attests only. Only an exact alpha tag may publish.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [verify, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: portable-*
          path: .scratch/release-assets
          merge-multiple: true
      - name: Verify publication authority and exact asset set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/gates.mjs publish
          node scripts/release/gates.mjs assets .scratch/release-assets
          for archive in .scratch/release-assets/*.tar.gz .scratch/release-assets/*.zip; do
            gh attestation verify "$archive" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
      - name: Publish verified prerelease (never overwrite an existing release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" .scratch/release-assets/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --target "$GITHUB_SHA" \
            --title "Swarmcrews $GITHUB_REF_NAME" --prerelease \
            --notes-file docs/portable-installation.md
