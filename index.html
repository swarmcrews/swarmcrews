<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0f1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Swarmcrews" />
    <title>Swarmcrews</title>
    <link rel="stylesheet" href="/src/root-load-state.css" />
  </head>
  <body style="margin:0;background:var(--bg-primary, #0a0e1a);color:var(--text-primary, #e6ecf5)">
    <div id="root">
      <div class="root-loading" role="status" aria-live="polite">
        <div class="root-loading__content">
          <span class="brand" role="img" aria-label="Swarmcrews"><span class="brand__mark"></span><span class="brand__wordmark"><span class="brand__swarm"></span><span class="brand__crews"></span></span></span>
          <span class="root-loading__message">Loading workspace…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
