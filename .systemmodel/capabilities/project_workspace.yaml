id: capability.project_workspace
type: capability
name: Project workspace lifecycle
summary: Users discover and explicitly register, rebind or attach canonical UUID sources with Git readiness choices; organize a durable Library with condensed recent-leader highlights and exact-item navigation, an activity-ranked compact index, an ordered Focus desk and contextual metadata editing; distinguish work attention from unread updates; safely archive or restore organization, including explicit bulk cleanup of definitively missing folders; and recover central state without duplicating work.
constraints: []
decisions: [ decision.typed_event_bus, decision.canonical_work_item_lifecycle, decision.portable_workspace_roots ]
risks:
  - risk.project_worktree_content_split
  - risk.legacy_workspace_root_overlap
suggested_files: [ server/project-activity.ts, src/project-library/ProjectIndex.tsx, src/project-library/RecentHighlights.tsx, src/project-library/use-library-batch.ts, server/project-library/activity.ts, src/project-library/ProjectDetails.tsx, src/project-library/TagPicker.tsx, src/project-library/CollectionPicker.tsx, shared/project-library/cleanup.ts, server/project-library/cleanup.ts, src/project-library/MissingProjectsDialog.tsx, shared/project-library/index.ts, src/project-library/LibraryWorkspace.tsx, src/project-library/use-library.ts, src/project-library/use-project-navigation.ts, server/project-library/routes.ts, server/project-library/store.ts, server/project-library/summary.ts, server/project-library/events.ts, server/project-library/lifecycle-events.ts, shared/repository-paths.ts, src/components/RepositoryPathPicker.tsx, server/repository-paths.ts, server/repository-directory-discovery.ts, server/routes/projects/paths.ts, src/ProjectList.tsx, src/ProjectGitWarning.tsx, src/App.tsx, src/ProjectHeader.tsx, src/ProjectPanel.tsx, src/api.ts, src/use-autosave.ts, server/project-git.ts, server/workspace-registry.ts, server/project-store.ts, server/routes/projects/core.ts, server/routes/projects/git.ts, server/routes/projects/workspace-lifecycle.ts ]
suggested_tests: [ server/project-activity.test.ts, src/project-library/LibraryHeader.test.tsx, src/ProjectPanel.drafts.test.tsx, src/project-library/LibraryOverview.test.tsx, src/project-library/ProjectIndex.test.tsx, server/project-library/activity.test.ts, src/project-library/ProjectAuthoring.test.tsx, src/project-library/AuthoringContinuity.test.tsx, server/project-library/cleanup.test.ts, tests/contracts/project-library-cleanup.test.ts, src/project-library/MissingProjectsDialog.test.tsx, src/project-library/LibraryWorkspace.test.tsx, src/project-library/use-library.test.tsx, src/project-library/ProjectUpdates.test.tsx, src/project-library/use-project-navigation.test.tsx, server/project-library/store.test.ts, server/project-library/summary.test.ts, tests/contracts/project-library.test.ts, src/components/RepositoryPathPicker.test.tsx, server/repository-paths.test.ts, server/repository-directory-discovery.test.ts, tests/contracts/projects-paths-routes.test.ts, src/ProjectList.test.tsx, src/mobile/ProjectsScreen.test.tsx, src/App.dom.test.tsx, src/api.test.ts, src/use-autosave.test.tsx, src/canvas-work-item-reconcile.test.ts, server/project-git.test.ts, server/workspace-registry.test.ts, server/project-store.test.ts, tests/contracts/projects-core-routes.test.ts ]
keywords: [ library, focus_desk, collections, tags, archive, restore, unread, freshness, autocomplete, browse, windows, UNC, SWARMCREWS_BROWSE_ROOTS, project, workspace, uuid, source_root, state_root, SWARMCREWS_HOME, mounted_volume, open, create, recover, migration, sidecar, readiness, git, initial_commit ]
entry_points:
  - surface: surface.canvas
    summary: Organize Library and Focus, explicitly open or recover UUID projects, and resume Activity or Canvas while retaining explicit source-owned editor drafts.
    files: [ src/ProjectList.tsx, src/project-library/LibraryWorkspace.tsx, src/App.tsx, src/ProjectHeader.tsx, src/ProjectPanel.tsx ]
    tests: [ src/ProjectList.test.tsx, src/project-library/LibraryWorkspace.test.tsx, src/project-library/ProjectUpdates.test.tsx, src/App.dom.test.tsx, src/ProjectPanel.test.ts, src/project-library/editor-continuity.test.tsx, src/project-library/organization-transitions.test.tsx, src/use-autosave.test.tsx ]
    flows: [ flow.open_project_workspace, flow.save_project_knowledge, flow.recover_after_disconnect ]
  - surface: surface.mobile
    summary: Share durable Library organization and safe archive/restore, retain explicit registration/Git choices, and resume native Activity/session views; Canvas destinations explicitly open the desktop surface.
    files: [ src/mobile/ProjectsScreen.tsx, src/project-library/LibraryWorkspace.tsx, src/ProjectGitWarning.tsx, src/mobile/MobileApp.tsx ]
    tests: [ src/mobile/ProjectsScreen.test.tsx, src/mobile/MobileApp.test.tsx ]
    flows: [ flow.open_project_workspace, flow.recover_after_disconnect ]
  - surface: surface.ws_api
    summary: Check Git readiness, enforce an explicit non-Git initialization choice, resolve registered workspace UUIDs, explicitly rebind or attach source roots, and synchronize project sessions, WorkItems, and lineages.
    files: [ server/project-git.ts, server/workspace-registry.ts, server/routes/projects/core.ts, server/routes/projects/git.ts, server/routes/projects/workspace-lifecycle.ts, server/commands/create-session.ts, server/commands/work-items.ts, server/commands/list-sessions.ts, server/commands/list-worktree-lineages.ts, server/commands/sync-session.ts ]
    tests: [ server/project-git.test.ts, server/workspace-registry.test.ts, tests/contracts/projects-core-routes.test.ts, server/commands/create-session.test.ts, server/commands/list-sessions.test.ts, server/commands/work-items.test.ts, server/commands/sync-session.test.ts ]
    flows: [ flow.open_project_workspace, flow.recover_after_disconnect ]
freshness:
  class: code_coupled
risk: high
domain: domain.workspace
depends_on: []
bridges:
  - to: flow.recover_after_disconnect
    reason: Project reopening restores session truth through the observability-owned reconnect flow.
