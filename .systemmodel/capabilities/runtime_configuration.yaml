id: capability.runtime_configuration
type: capability
name: Runtime configuration
summary: Native Claude/Copilot tool asks use a shared invocation-only approval bridge with Allow once / Deny in Activity, Canvas/fullscreen and mobile; unsupported harnesses do not advertise toolApprovalRequests. Crew panels use a bounded server-derived current-primary, same-WorkItem child-attempt roster, independent of legacy task plans, and retain the requesting child session identity rather than replying as the displayed Leader. Lifecycle invalidations and reconnect refetch that roster; superseded attempts cannot reappear. Live requests expire denied and cannot be replayed after restart. Users can choose compatible harness and model settings while independently configuring Git change placement and a truthfully reported process sandbox policy. Portable installations bundle the application and Node only; provider CLIs and SDKs stay external, missing providers remain visible, and no provider is installed automatically. Server stop/restart fences new execution, drains active providers, and cleans owned processes before a successful portable restart; this supervision is not a sandbox guarantee. Project Connections provide guided MCP setup, testing and sign-in; Swarmcrews owns external clients and credentials independently of harness initialization.
constraints: []
decisions: [ decision.role_gated_agent_tools, decision.portable_workspace_roots ]
suggested_files: [ server/session-crew.ts, shared/session-crew.ts, server/commands/sync-session.ts, server/work-item-service-events.ts, shared/tool-approval.ts, server/tool-approvals.ts, src/SettingsMenu.tsx, src/components/SessionToolbar.tsx, src/nodes/leader/SandboxPolicyControls.tsx, server/harness/sandbox-policy.ts, server/harness/codex/options.ts, server/harness/copilot/sandbox.ts, server/commands/list-harnesses.ts, server/harness/external-sdk.ts, server/harness/readiness.ts, scripts/release/build.mjs, scripts/release/gates.mjs, .github/workflows/release.yml, server/shutdown.ts, server/execution-lifecycle.ts, shared/owned-processes.mjs ]
suggested_tests: [ tests/contracts/session-crew.test.ts, server/session-crew.test.ts, shared/session-crew.test.ts, server/tool-approvals.test.ts, server/session-tool-approvals.test.ts, tests/contracts/tool-approval.test.ts, src/SettingsMenu.test.tsx, src/components/SessionToolbar.test.tsx, src/nodes/leader/SandboxPolicyControls.test.tsx, server/harness/sandbox-policy.test.ts, server/harness/codex/options.test.ts, server/harness/copilot/sandbox.test.ts, server/harness/copilot/sandbox.integration.test.ts, server/commands/list-harnesses.test.ts, server/harness/external-sdk.test.ts, scripts/release/config.test.mjs, scripts/release/gates.test.mjs, scripts/release/installers.test.mjs, scripts/release/smoke.mjs, scripts/release/launcher.test.mjs, server/shutdown.test.ts, server/execution-lifecycle.test.ts ]
keywords: [ runtime, harness, model, sandbox, filesystem, approval, unmanaged, worktree, change_mode, control_error, connections, mcp, oauth, portable, release, external_sdk ]
entry_points:
  - surface: surface.agent_tools
    summary: Discover and invoke project connections through five shared tools; clients are invocation-scoped, credentials stay on the host, and enabled/tool restrictions are checked on each call. External access is independent of the harness filesystem sandbox.
    files: [ server/mcp-connections/tools.ts, server/mcp-connections/runtime.ts, server/mcp-connections/oauth.ts, server/mcp-connections/credentials.ts, server/session-host.ts ]
    tests: [ server/mcp-connections/runtime.test.ts, server/mcp-connections/oauth.test.ts, server/mcp-connections/harnesses.test.ts ]
    flows: [ flow.configure_runtime ]
  - surface: surface.activity
    summary: Answer live invocation-only tool approvals for the displayed session and its server-derived current children; preserve the requesting session identity and keep Allow once / Deny separate from change review.
    files: [ src/ActivityView.tsx, src/components/CrewToolApprovals.tsx, src/components/ToolApprovalPanel.tsx ]
    tests: [ tests/contracts/session-crew.test.ts, src/components/CrewToolApprovals.test.tsx, src/components/ToolApprovalPanel.test.tsx ]
    flows: [ flow.configure_runtime ]
  - surface: surface.canvas
    summary: Configure Git change mode separately from sandbox policy and answer live native tool approvals separately from change review.
    files: [ src/components/CrewToolApprovals.tsx, src/components/ToolApprovalPanel.tsx, src/SettingsMenu.tsx, src/mcp-connections/ConnectionsPanel.tsx, src/mcp-connections/ConnectionForm.tsx, src/components/SessionToolbar.tsx, src/nodes/LeaderNode.tsx, src/nodes/leader/SandboxPolicyControls.tsx, src/nodes/leader/ConfigFooter.tsx ]
    tests: [ src/components/CrewToolApprovals.test.tsx, src/components/ToolApprovalPanel.test.tsx, tests/e2e/tool-approvals.spec.mjs, src/SettingsMenu.test.tsx, src/components/SessionToolbar.test.tsx, src/nodes/LeaderNode.test.tsx, src/nodes/leader/SandboxPolicyControls.test.tsx, src/nodes/leader/ConfigFooter.test.tsx ]
    flows: [ flow.configure_runtime, flow.launch_leader, flow.steer_session ]
  - surface: surface.mobile
    summary: Set mobile defaults and per-launch harness, model, permission, and isolation choices; answer live invocation-only approvals using the requesting session identity.
    files: [ src/components/CrewToolApprovals.tsx, src/mobile/SessionChatScreen.tsx, src/components/ToolApprovalPanel.tsx, src/mobile/SettingsScreen.tsx, src/mobile/LaunchScreen.tsx, src/mobile/launch-models.ts ]
    tests: [ src/mobile/SessionChatScreen.commands.test.tsx, tests/e2e/tool-approvals.spec.mjs, src/mobile/SettingsScreen.test.tsx, src/mobile/LaunchScreen.test.tsx, src/mobile/launch-models.test.ts ]
    flows: [ flow.configure_runtime, flow.launch_leader ]
  - surface: surface.ws_api
    summary: Reveal cached model choices immediately and refresh catalogs per harness; validate launches against authoritative readiness independently of the display cache, report sandbox enforcement and apply supported runtime mutations. Resolve live approval IDs only within their requesting session and invocation; expired requests cannot be replayed.
    files: [ server/commands/respond-tool-approval.ts, shared/tool-approval.ts, shared/workspace-contracts.ts, server/harness/sandbox-policy.ts, server/commands/list-harnesses.ts, server/commands/set-model.ts, server/commands/set-permission-mode.ts ]
    tests: [ tests/contracts/tool-approval.test.ts, shared/workspace-contracts.test.ts, server/harness/sandbox-policy.test.ts, server/commands/list-harnesses.test.ts, server/commands/set-model.test.ts, server/commands/set-permission-mode.test.ts ]
    flows: [ flow.configure_runtime ]
freshness:
  class: code_coupled
risk: high
domain: domain.platform
depends_on: []
bridges:
  - to: flow.launch_leader
    reason: Runtime settings are applied when the execution-lifecycle leader launch flow creates a host.
  - to: flow.steer_session
    reason: Runtime controls affect follow-up behavior owned by the execution-lifecycle steering flow.
risks: [ risk.sandbox_policy_overclaim ]
