id: surface.agent_tools
type: surface
name: Agent tools
summary: Role-gated tools for planning, delegation, reporting and connections. Shared contracts use draft-7 descriptors, object-root output schemas and bounded JSON snapshots; SDK-parsed inputs must not be normalized twice. Pi uses model-visible text and persisted details for structured data; Copilot uses text, omitting redundant display JSON. Native support is consumer/version-specific. Post-execution failures do not prove rollback. Authority stays server-owned; no Codemode or stronger sandbox guarantees.
