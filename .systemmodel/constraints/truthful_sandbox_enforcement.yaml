id: constraint.truthful_sandbox_enforcement
type: constraint
statement: Filesystem scope and approval policy are independent requested axes, and effective guarantees report unsupported harness axes as unmanaged.
applies_to:
  capabilities: []
  flows: []
  surfaces: []
  files:
    - shared/workspace-contracts.ts
    - server/harness/types.ts
    - server/harness/sandbox-policy.ts
    - server/harness/codex/index.ts
    - server/harness/codex/options.ts
    - server/harness/copilot/index.ts
    - server/harness/copilot/sandbox.ts
    - server/harness/copilot/permissions.ts
    - src/nodes/leader/SandboxPolicyControls.tsx
severity: critical
agent_instruction: Keep Git change mode separate from process sandbox policy; honor an explicit sandbox policy before legacy plan mode, default to workspace-write, and require explicit unrestricted access. Codex uses its native policy. Copilot must apply its native per-session sandbox before prompting on create and resume, deny bypass, check in-process file writes, and fail closed on policy setup errors. Verify native backend behavior with the opt-in integration test before asserting live enforcement; mocked RPC tests alone are insufficient. Label unsupported axes unmanaged.
review_gate: gate.sandbox_guarantees
suggested_tests: [ shared/workspace-contracts.test.ts, server/harness/sandbox-policy.test.ts, server/harness/codex/index.test.ts, server/harness/codex/options.test.ts, src/nodes/leader/SandboxPolicyControls.test.tsx ]
evidence: [ decision.portable_workspace_roots ]
domain: domain.platform
scope: domain
guards: []
