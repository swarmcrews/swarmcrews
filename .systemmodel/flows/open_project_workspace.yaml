id: flow.open_project_workspace
type: flow
name: Open, organize, or recover a project workspace
summary: A user selects a durable Library or Focus project, or explicitly registers a server folder with a Git readiness decision; UUID identity loads central state, bounded attention/update summaries guide next actions, and guarded return navigation preserves drafts and Library context.
constraints: []
decisions: [ decision.typed_event_bus, decision.canonical_work_item_lifecycle, decision.portable_workspace_roots ]
suggested_files: [ src/project-library/ProjectIndex.tsx, src/project-library/RecentHighlights.tsx, src/project-library/use-library-batch.ts, server/project-library/activity.ts, src/project-library/ProjectDetails.tsx, src/project-library/TagPicker.tsx, src/project-library/CollectionPicker.tsx, shared/project-library/cleanup.ts, server/project-library/cleanup.ts, src/project-library/MissingProjectsDialog.tsx, shared/project-library/index.ts, src/project-library/LibraryWorkspace.tsx, src/project-library/use-project-navigation.ts, src/project-library/use-library.ts, server/project-library/routes.ts, server/project-library/summary.ts, server/project-library/events.ts, src/components/RepositoryPathPicker.tsx, server/repository-paths.ts, server/repository-directory-discovery.ts, server/routes/projects/paths.ts, src/ProjectList.tsx, src/ProjectGitWarning.tsx, src/App.tsx, src/ProjectHeader.tsx, src/mobile/ProjectsScreen.tsx, src/api.ts, src/use-work-items.ts, server/project-git.ts, server/workspace-registry.ts, server/routes/projects/core.ts, server/routes/projects/git.ts ]
suggested_tests: [ src/project-library/LibraryOverview.test.tsx, src/project-library/ProjectIndex.test.tsx, server/project-library/activity.test.ts, src/project-library/ProjectAuthoring.test.tsx, src/project-library/AuthoringContinuity.test.tsx, server/project-library/cleanup.test.ts, tests/contracts/project-library-cleanup.test.ts, src/project-library/MissingProjectsDialog.test.tsx, src/project-library/LibraryWorkspace.test.tsx, src/project-library/ProjectUpdates.test.tsx, src/project-library/use-project-navigation.test.tsx, src/project-library/project-navigation-confirmation.test.tsx, src/mobile/MobileApp.test.tsx, src/project-library/use-library.test.tsx, src/project-library/editor-continuity.test.tsx, src/project-library/organization-transitions.test.tsx, tests/contracts/project-library.test.ts, src/components/RepositoryPathPicker.test.tsx, server/repository-paths.test.ts, tests/contracts/projects-paths-routes.test.ts, src/ProjectList.test.tsx, src/mobile/ProjectsScreen.test.tsx, src/App.dom.test.tsx, src/api.test.ts, src/use-autosave.test.tsx, src/canvas-work-item-reconcile.test.ts, server/project-git.test.ts, server/workspace-registry.test.ts, tests/contracts/projects-core-routes.test.ts ]
steps:
  - Authorize registration and canonical source independently of optional Library history. Classified SQLite corruption/capacity/lock failures in that history must not block startup or core opening; preserve damaged bytes and expose Library unavailability. Source changes, symlink/authorization failures and ambiguous filesystem errors still reject.
  - Load the durable UUID registry Library independently of the capped recents list. Persist collections, tags, staged metadata, archived state and manually ordered Focus membership centrally; collection or Focus changes never execute agents or delete projects.
  - Present Library as up to three project highlights, each containing at most three distinct recent primary leader WorkItems, followed by a complete compact project index. Omit context-only highlights and redundant descriptions/footers. The card opens project Activity without a remembered item selection; a leader row opens its exact WorkItem and the new-count control opens unread updates without acknowledging them. Apply search and filters to both; featured projects remain in the index. Rank by latest recorded activity with last-opened fallback, never by only the currently visible summaries. Focus retains explicit manual order and Archived retains restoration controls.
  - Degrade a replaced registered source to an unknown summary without suppressing valid batch siblings or passing that source to runtime readers; foreign UUIDs remain unauthorized. Active orphan child hosts still block archive even if their parent is absent from the visible roster.
  - Read historical top-one activity metadata and at most three recent primary leader item IDs/titles/timestamps per project in bounded indexed batches independently of live runtime authority. Deduplicate leader continuations and exclude child-only, other-role and archived items; never hydrate transcripts or task JSON. Hydrate status only for visible projects, highlights and open panels through shared visibility-aware polling with deadlines and backoff; missing, expired or contradictory authority is unknown/stale, never fabricated quiet state. Historical read projections never acknowledge updates or authorize archive.
  - Edit project metadata in a contextual side sheet on desktop and a full-width sheet on mobile. The editable name is the title; tag chips include pending input in explicit Save and dirty-navigation guards. Search or create collections beside the draft; creation is immediate but project membership stays staged until Save. Preserve draft fields and focus through failures, collection creation and close cancellation; revision conflicts require review before retry. Secondary maintenance lives in desktop Library tools and the mobile tools disclosure.
  - Keep the home-page folder chooser closed while projects load or when existing projects are present. Show folder selection and manual-entry controls together below its header only when closed; automatically open for a confirmed empty list before user interaction, and respect cancellation across refreshes.
  - Start the folder chooser at permitted server Home or configured locations. Persist multiple starred folders as browser-local navigation shortcuts using a star beside the current breadcrumb; navigating to an ancestor allows starring it. Locations lists Home first, saved folders with full paths and removal controls, and configured browsing roots. Opening a shortcut performs authenticated directory discovery without selecting a project; unstar preserves the current selection and unavailable shortcuts remain removable. Filter folder names within the current directory and navigate with breadcrumbs and parent controls. Browsing and opted-in manual path drafts preserve the selected folder until explicit confirmation; cancel leaves it unchanged and project actions wait for the chooser to finish.
  - Offer authenticated shallow directory discovery within server-configured roots, checking lexical and resolved containment; browsing never registers a workspace or creates files.
  - When scoped name search has no matching directories, offer a server-checked missing child destination only for a valid single folder name; existing files, symlinks, invalid paths and failed absence checks cannot be proposed. Selecting the destination or Ctrl+Enter preserves read-only discovery, switches desktop to Create, and defers folder creation to explicit project registration and the existing Git decision flow. Changing the uncreated destination browses its existing parent.
  - Interpret pasted paths using the server platform, including home expansion and explicit Windows drive or UNC roots; reject ambiguous Windows drive-relative paths.
  - Check whether the source root belongs to a Git worktree; for a non-Git source, require an explicit choice to initialize and create the first commit or continue after a reliability warning.
  - Canonicalize an explicitly opened source root, including mounted-volume paths, and bind it to a stable UUID.
  - Preserve one unambiguous legacy UUID and non-destructively import a legacy .minions sidecar into SWARMCREWS_HOME/workspaces/<uuid> on first registration.
  - Rebind a moved source to its existing UUID, or explicitly attach a copied source; copies otherwise receive a new UUID.
  - Load nodes, graph, transform, settings, skills, and project knowledge from the bound state root.
  - Connect WebSocket services using the opaque workspace UUID and issue list_sessions, list_work_items, and list_worktree_lineages.
  - Reconcile persisted surface bindings and sync mounted sessions from authoritative host snapshots.
  - Expose readiness or autosave failures for explicit retry without launching duplicate runs.
  - Keep explicit displayed-event acknowledgment separate from work review and approval. Per-update clears use signed receipts that fence only shown event IDs/revisions. Explicit Mark all read (one project or Library-wide, after confirmation) is bounded by an as-of watermark that never exceeds the current time; arrivals after it stay unread and it never changes review, decision or integration state. Meaningful events cover persisted lifecycle changes and shared context saves, not token streams or external filesystem edits.
  - Archive only after a fresh server-side runtime/lifecycle/integration check under a durable write fence. Active, unresolved or unknown work blocks archive; successful archive preserves UUID, source, history and metadata while removing Focus membership. Restore returns Library membership without silently restoring Focus; opening from Details or Updates also requires explicit restoration.
  - Offer explicit bulk missing-folder cleanup on desktop and mobile. Scan registered unarchived projects in bounded batches and preview selectable missing paths. Only definite ENOENT absence qualifies; symlinks, files and permission failures do not. Recheck source identity, absence, metadata revision and runtime-only archive eligibility under the durable write fence; active, unresolved or unknown work remains blocked. Archive organization reversibly, report per-project skips and require a rescan after ambiguous writes; normal missing-source summaries remain unknown.
  - Preserve Library filters, page, scroll and exact project/work-item destinations across navigation. Consult source-owned dirty/pending/failed editor markers before switching or leaving. Offer explicit draft-loss confirmation that resumes the requested destination, or Open draft to expand its retained registration or Context editor without navigating; cancellation preserves the project and draft. Confirmed desktop project departure also clears that project’s cached Leader composers, while pending or failed Canvas/settings saves remain guarded; retain participating Canvas editors across Activity changes; missing or archived destinations show an explicit fallback rather than another run's data. Keep native mobile session navigation; a Canvas destination explicitly opens desktop.

freshness:
  class: code_coupled
risk: high
domain: domain.workspace
primary_capability: capability.project_workspace
bridges: []
risks: [ risk.legacy_workspace_root_overlap ]
